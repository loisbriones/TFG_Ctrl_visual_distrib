services:
  emisor:
    build: .
    network_mode: "host"
    privileged: true
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - ROS_DOMAIN_ID=42
    volumes:
      - ./src/image_processor_pkg:/ros2_ws/src/image_processor_pkg
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install --packages-select image_processor_pkg &&
        source install/setup.bash &&
        ros2 run image_processor_pkg publisher_node --ros-args -p node_id:=prueba -r __ns:=/rpi --params-file /ros2_ws/src/image_processor_pkg/config/params.yml
      "


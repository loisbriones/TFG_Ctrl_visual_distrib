/**:
  ros__parameters:
    debug: False
    modo_calibracion: True
    coches: ["car1"]
    
    #Parametros para la camara
    camera:
      mode: 2

    # Parametros para el modulo de deteccion 
    detection:
      stiker_front: "verde"
      stiker_back: "azul"
      sector_color: "naranja"
      kernel_size: 5
      min_area: 70 
      
    # Parámetros para el controlador
    controller:
      minimum_speed: 50
      maximum_speed: 75

    # Parámetros para el Arduino
    arduino:
      port: "/dev/ttyACM0"
      baudrate: 115200
      calibration_speed: 50 


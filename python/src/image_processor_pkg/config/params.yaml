/**:
  ros__parameters:
    modo_calibracion: True
    coches: ["car1"]
    
    #Parametros para la camara 
    camera:
      # Controlar el tamaño del frame
      mode: 2
      mascara_kernel_size: 25 
      debug: False

      # Parametros para el modulo de deteccion 
      detection:
        stiker_front: "verde"
        stiker_back: "azul"
        sector_color: "naranja"
        kernel_size: 5
        min_area: 40 
      
    # Parámetros para el controlador
    controller:
      minimum_speed: 60 
      maximum_speed: 80
      distancia_nodos_trayectoria: 15.0
      umbral_derrape: 15.0

    # Parámetros para el Arduino
    arduino:
      port: "/dev/ttyACM0"
      baudrate: 115200
      calibration_speed: 60 


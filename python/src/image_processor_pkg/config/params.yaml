/**:
  ros__parameters:
    modo_calibracion: True
    coches: ["car1"]
    # Tiempo que puede pasar desde que nos envian un paquete hasta que consideramos que el nodo se callo
    delta_t: 1
    # Tiempo que tiene que pasar para que se ejecute el timer de comprobacion de estado
    hearthbear_timer: 0.066 
    
    #Parametros para la camara 
    camera:
      # Controlar el tamaño del frame
      mode: 2
      mascara_kernel_size: 25 
      debug: False

      # Parametros para el modulo de deteccion 
      detection:
        stiker_front: "verde"
        stiker_back: "azul"
        finish_line_color: "naranja"
        kernel_size: 5
        min_area: 40 
      
    # Parámetros para el controlador
    controller:
      minimum_speed: 78 
      maximum_speed: 84 
      distancia_nodos_trayectoria: 15.0
      umbral_control_trayectoria_correcta: 60.0 
      umbral_derrape_peligro: 16.0
      umbral_derrape_seguro: 15.0
      latencia_min_nodos: 1
      latencia_max_nodos: 10
      debounce_meta: 1.0

    # Parámetros para el Arduino
    arduino:
      port: "/dev/ttyACM0"
      baudrate: 115200
      calibration_speed: 65 


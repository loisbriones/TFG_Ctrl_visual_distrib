/**:
  ros__parameters:
    modo_calibracion: True
    # Lista de coches que queremos controlar, genera un CarControllerNode por cada uno
    # Cada nombre de esta lista tiene que tener su bloque dentro de "cars"
    coches: ["car1","car2"]

    # Configuracion de cada coche. La clave (car1, car2...) es su nombre y su
    # namespace de ROS. Aqui va todo lo que distingue un coche de otro:
    #   stiker_front/back  colores de sus dos pegatinas
    #   carril             carril del Arduino al que esta conectado ("1" o "2")
    #   modo               quien decide su PWM: manual, incremental, automatico o politica
    cars:
      car1:
        stiker_front: "amarillo"
        stiker_back: "violeta"
        carril: "2"
        modo: "automatico"
      car2:
        stiker_front: "verde"
        stiker_back: "azul"
        carril: "1"
        modo: "manual"

    # Parametros para la camara
    camera:
      # Resolucion de captura. 0=160x120, 1=320x240, 2=640x480, 3=800x600, 4=1280x720
      mode: 2
      # Que camara del sistema usar, el numero (0) o la ruta entera (/dev/video0)
      device: '0'
      # Kernel con el que se ensancha la mascara de trayectoria
      mascara_kernel_size: 25 
      # Si queremos activar el modo debug de la camara
      debug: True 

      detection:
        # Color de la franja que marca la linea de meta
        finish_line_color: "naranja"
        # Kernel de la limpieza de ruido. Tiene que ser impar
        kernel_size: 5
        # Pixeles minimos de una mancha de color para aceptarla como pegatina
        min_area: 40 
      
    # Parametros para el controlador
    controller:
      # PWM minimo con el que empieza la carrera el coche
      minimum_speed: 75 
      # PWM maximo limite que puede alcanzar durante la carrera el coche
      maximum_speed: 85 
      # Separacion minima (px) entre nodos de la trayectoria base
      distancia_nodos_trayectoria: 15.0
      # Tolerancia (px) para dar por valido un cruce de meta
      umbral_meta: 30.0
      # Segundos sin frames validos para dar por perdida la camara activa y
      # conmutar a otra
      timeout_camara_activa: 0.3
      # En modo incremental marca el numero de vueltas que tiene que pasar para subir el PWM
      vueltas_incremento: 10

      # Parametros AVANZADOS del algoritmo de velocidad. El algoritmo no es un
      # nodo de ROS, asi que los lee el controlador y se los pasa. Van en px, en
      # celdas o en unidades de PWM, y se dice en cada uno
      algoritmo:
        # -- Deteccion de derrape y localizacion --
        # Distancia (px) que se tiene que separar la pegatina trasera de la
        # trayectoria para decidir que se esta produciendo un derrape
        umbral_derrape: 10.0
        # Distancia (px) que se tiene que separar la pegatina delantera para
        # marcar la deteccion como falsa
        max_dist_ruta: 80.0
        # Celdas de los extremos de la trayectoria abierta donde no se abre
        # derrape porque saldrian falsos positivos
        margen_extremo_celdas: 2

        # -- Construccion de la cadena de celdas --
        # Separacion entre celdas (px)
        paso_celda: 15.0
        # Separacion (px) a partir de la cual se da por hecho que ahi hay un trozo
        # de circuito que la camara no ve, y se crea una celda gigante
        umbral_celda_gigante: 150.0
        # Distancia maxima (px) entre el ultimo punto y el primero para dar por
        # hecho que la trayectoria se cierra sobre si misma, es decir que una sola
        # camara ve todo el circuito
        umbral_cierre: 60.0

        # -- Perfil de zonas y ciclo de aprendizaje --
        # Cuanto sube el PWM de cada zona no protegida al cruzar meta
        incremento_vuelta: 1.0
        # Cuanto baja el PWM de una zona al derrapar en ella
        reduccion_derrape: 2.0
        # Distancia hacia atras (px) que hay que castigar cuando se crea una zona
        # de derrape, para que el coche llegue mas despacio
        # Lo mejor es que sea un multiplo de paso_celda
        retroceso_creacion: 150.0
        # Distancia hacia atras (px) que hay que castigar cuando se unen dos zonas
        # de derrape, para que el coche llegue mas despacio
        # Lo mejor es que sea un multiplo de paso_celda
        retroceso_fusion: 60.0
        # Celdas de holgura para decidir que un derrape es el mismo de antes y
        # hay que ampliar su zona en vez de crear otra nueva
        margen_fusion_celdas: 1
        # Vueltas que una zona se queda sin poder subir despues de un derrape
        vueltas_proteccion: 2

    # Conexion serie con el Arduino que alimenta los carriles
    arduino:
      # Puerto donde aparece el Arduino al enchufarlo por USB
      port: "/dev/ttyACM0"
      baudrate: 115200
      # PWM que se aplica durante la vuelta de calibracion
      calibration_speed: 75 

    net_probe:

      # Con False el sistema queda como si esto no existiera
      enabled: True 

      # Camaras a las que se manda el echo, con el mismo nombre con el que se
      # levantan (NODE_ID)
      camaras: ["camara_01"]

      # Frecuencia con la que se mandan los echos
      frecuencia_hz: 5.0

      # Bytes de relleno, para que el echo pese lo mismo que un CarLocation
      padding_bytes: 128

      # Un echo que tarde mas de esto en volver se da por perdido
      umbral_perdida_ms: 500.0

      # Nombre del CSV donde se guardan los datos
      # Si no se cambia, las filas se añaden al fichero que ya estuviera creado
      etiqueta: "2_COCHES_CIRCUITO_FINAL"

      # Ruta donde se guarda el CSV con los resultados
      directorio_csv: "/ros2_ws/src/image_processor_pkg/logs_red"


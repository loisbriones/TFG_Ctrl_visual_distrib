<!DOCTYPE html>
<!--
  Mosaico de lo que ve cada camara, en directo.

  Lo sirve VisualizacionNode.py en el mismo puerto que el panel de la carrera
  (8990), en /camaras. Es la pagina de ANTES de la carrera: se levantan solo los
  nodos camara, se abre esto y se van encuadrando hasta que entre todas se vea
  el circuito entero, sin ir maquina por maquina enchufando el USB.

  Aqui solo esta el esqueleto: los recuadros de cada camara los crea camaras.js
  segun quien vaya apareciendo en la red.

  Cada imagen es un <img> apuntando a /video/<camara>, que es un MJPEG. El
  navegador sabe pintarlo el solo, asi que no hay ni una linea de JavaScript de
  video en toda la pagina. Comparte estilos.css con el panel, y por lo mismo que
  aquel: sin CDN, sin frameworks y sin dependencias, porque en una carrera esto
  se abre en un portatil que puede estar en una red sin salida a internet.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cámaras en directo</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="cabecera">
  <h1><span class="punto-vivo" id="vivo">●</span> Cámaras en directo</h1>
  <a class="enlace-pagina" href="/">← carrera</a>
</div>

<div class="aviso-mosaico">
  Cada cámara solo manda su imagen mientras la estás mirando: al pausarla o al
  cerrar la pestaña, el panel se da de baja de su topic y deja de ocupar red.
</div>

<div id="mosaico"></div>

<script src="camaras.js"></script>
</body>
</html>

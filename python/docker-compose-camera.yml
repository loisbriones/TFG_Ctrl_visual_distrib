services:
  emisor:
    build: .
    network_mode: "host" 
    privileged: true
    ipc: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - NODE_ID=${NODE_ID}
      - CAMERA_DEV=${CAMERA_DEV}
    volumes:
      - ./src/image_processor_pkg:/ros2_ws/src/image_processor_pkg
    command: >
      bash -c "source /opt/ros/humble/setup.bash && colcon build --symlink-install &&
               source install/setup.bash && ros2 launch image_processor_pkg CameraLaunch.py camera_name:=${CAMERA_DEV} node_id:=${NODE_ID}"

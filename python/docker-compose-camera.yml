services:
  emisor:
    build: .
    network_mode: "host" # Crucial para comunicación entre máquinas
    privileged: true
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - NODE_ID=camara_01 # Cambia esto en cada Raspberry (camara_01, camara_02...)
    volumes:
      - ./src/image_processor_pkg:/ros2_ws/src/image_processor_pkg
    command: >
      bash -c "source /opt/ros/humble/setup.bash && colcon build --symlink-install &&
               source install/setup.bash && ros2 launch image_processor_pkg camera_launch.py"
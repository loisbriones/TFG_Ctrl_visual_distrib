# Lanza launch/ManualLaunch.py
# Uso:  docker compose -f docker-compose-manual.yml up
services:
  control:
    build: .
    network_mode: "host"
    privileged: true
    ipc: "host"
    pid: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
      - TZ=Europe/Madrid
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./src/image_processor_pkg:/ros2_ws/src/image_processor_pkg
    command: >
      bash -c "source /opt/ros/humble/setup.bash && colcon build --symlink-install &&
               source install/setup.bash && ros2 launch image_processor_pkg ManualLaunch.py"

services:
  receptor:
    build: .
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
    volumes:
      - ./src/image_processor_pkg:/ros2_ws/src/image_processor_pkg
    command: >
      bash -c "cd /ros2_ws && 
               colcon build --packages-select image_processor_pkg && 
               source /ros2_ws/install/setup.bash && 
               export PYTHONPATH=$PYTHONPATH:/ros2_ws/install/image_processor_pkg/lib/python3.10/site-packages &&
               ros2 run image_processor_pkg subscriber.py"
